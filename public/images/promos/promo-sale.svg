<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a4e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#grad)"/>
  <!-- Decorative circles -->
  <circle cx="1000" cy="250" r="300" fill="none" stroke="#e63946" stroke-width="2" opacity="0.3"/>
  <circle cx="1000" cy="250" r="220" fill="none" stroke="#e63946" stroke-width="2" opacity="0.3"/>
  <circle cx="1000" cy="250" r="140" fill="#e63946" opacity="0.15"/>
  <!-- Diagonal accent line -->
  <line x1="0" y1="400" x2="800" y2="0" stroke="#e63946" stroke-width="1" opacity="0.2"/>
  <line x1="0" y1="500" x2="900" y2="0" stroke="#e63946" stroke-width="1" opacity="0.15"/>
  <!-- Title -->
  <text x="80" y="220" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="white">MEGA SALE</text>
  <!-- Subtitle -->
  <text x="80" y="295" font-family="Arial, sans-serif" font-size="32" fill="#e63946">Até 50% OFF em Camisas Selecionadas</text>
  <!-- CTA Bar -->
  <rect x="80" y="340" width="200" height="60" rx="4" fill="#e63946"/>
  <text x="180" y="378" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">VER COLEÇÃO</text>
  <!-- Brand -->
  <text x="80" y="460" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.6">MANTO SPORTS — VISTA SUA PAIXÃO</text>
</svg>