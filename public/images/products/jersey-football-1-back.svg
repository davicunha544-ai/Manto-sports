<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8102e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="700" fill="url(#bg)"/>
  <!-- Jersey shape -->
  <polygon points="150,80 60,180 120,210 120,580 480,580 480,210 540,180 450,80 370,120 300,100 230,120" fill="#ffffff" stroke="#c8102e" stroke-width="3"/>
  <!-- Collar -->
  <path d="M230,120 Q300,160 370,120 Q355,180 300,190 Q245,180 230,120Z" fill="#c8102e"/>
  <!-- Sleeve stripes -->
  <polygon points="60,180 90,210 120,210 120,190" fill="#c8102e"/>
  <polygon points="540,180 510,210 480,210 480,190" fill="#c8102e"/>
  <!-- Center stripe -->
  <rect x="280" y="200" width="40" height="280" fill="#c8102e" opacity="0.6"/>
  <!-- Number -->
  <text x="300" y="430" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="#c8102e" opacity="0.9">10</text>
  <!-- Brand tag -->
  <text x="300" y="640" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="white" opacity="0.7">MANTO SPORTS</text>
</svg>